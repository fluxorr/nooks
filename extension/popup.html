<!DOCTYPE html>
<html>
<head>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 280px;
      background: #0a0a0a;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .logo {
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, #f5a623, #f97316);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo svg { width: 14px; height: 14px; }
    .title { font-weight: 600; font-size: 14px; }
    .content { padding: 16px; }
    .shortcut {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      background: #171717;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .shortcut-label { font-size: 12px; color: #737373; }
    .shortcut-key {
      display: flex;
      gap: 4px;
    }
    .key {
      padding: 4px 8px;
      background: #262626;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: #f5a623;
      color: #0a0a0a;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: #d4921e; }
    .hint {
      text-align: center;
      font-size: 11px;
      color: #525252;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
      </svg>
    </div>
    <span class="title">Nooks</span>
  </div>
  <div class="content">
    <div class="shortcut">
      <span class="shortcut-label">Quick save</span>
      <div class="shortcut-key">
        <span class="key">Cmd</span>
        <span class="key">Shift</span>
        <span class="key">S</span>
      </div>
    </div>
    <button class="btn" id="saveBtn">Save Current Page</button>
    <p class="hint">Or hover over any link for 500ms</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
